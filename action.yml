name: "Setup Nextflow"
description: |
  Install Nextflow and its dependencies into a GitHub Actions environment, cache
  the installation, and add it to the PATH
author: "nf-core"
inputs:
  version:
    description: "The Nextflow version to download (if necessary) and use. Example: 21.10.3"
    required: false
    default: "stable"
  java-version:
    description: "The Java version to install as the required dependency of Nextflow. Passed to the underlying setup-java action."
    required: false
    default: ""
  java-distribution:
    description: "The Java distribution to install as the required dependency of Nextflow. Passed to the underlying setup-java action."
    required: false
    default: "temurin"
  secrets:
    description: "Nextflow secrets to set, in KEY=VALUE format (one per line). See README for usage."
    required: false
    default: ""
outputs:
  version:
    description: The version of Nextflow that has been installed
    value: ${{ steps.install-nextflow.outputs.version }}
  path:
    description: The path to where the Nextflow executable has been installed
    value: ${{ steps.install-nextflow.outputs.path }}
  tool-cache-hit:
    description: |
      A boolean value to indicate an exact match was found in the tool cache
      for this version of Nextflow
    value: ${{ steps.install-nextflow.outputs.tool-cache-hit }}
  cache-hit:
    description: |
      A boolean value to indicate an exact match was found in the JAR capsule
      cache for this version of Nextflow
    value: ${{ steps.install-nextflow.outputs.jar-cache-hit }}
  java-version:
    description: "Actual version of the Java environment that has been installed"
    value: ${{ steps.install-java.outputs.version }}
  java-distribution:
    description: "Distribution of Java that has been installed"
    value: ${{ steps.install-java.outputs.distribution }}
  java-path:
    description: "Path to where the Java environment has been installed (same as $JAVA_HOME)"
    value: ${{ steps.install-java.outputs.path }}
  java-cache-hit:
    description: "A boolean value to indicate an exact match was found for the Java install primary key"
    value: ${{ steps.install-java.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/find-nextflow-version
      id: find-nextflow-version
      with:
        version: ${{ inputs.version }}
        java-version: ${{ inputs.java-version }}
        token: ${{ github.token }}
    - uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      id: install-java
      with:
        java-version: ${{ steps.find-nextflow-version.outputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
    - uses: ./.github/actions/install-nextflow
      id: install-nextflow
      with:
        version: ${{ steps.find-nextflow-version.outputs.nextflow-version }}
    - uses: ./.github/actions/add-secrets
      id: add-secrets
      with:
        path: ${{ steps.install-nextflow.outputs.path }}
        secrets: ${{ inputs.secrets }}
branding:
  icon: "shuffle"
  color: "green"
