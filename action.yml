name: "Setup Nextflow"
description: "Install Nextflow and add it to the PATH"
author: "nf-core"
inputs:
  version:
    description: "The Nextflow version to download (if necessary) and use. Example: 21.10.3"
    required: false
    default: "latest-stable"
  all:
    description: "Whether to install every Nextflow release via the '-all' distribution."
    required: false
    default: "false"
  install-java:
    description: "Whether to install Java. Set to 'false' to skip the Java installation and use the Java already available on the runner (at your own risk)."
    required: false
    default: "true"
  java-version:
    description: "The Java version to install as the required dependency of Nextflow. Passed to the underlying setup-java action."
    required: false
    default: "17"
  java-distribution:
    description: "The Java distribution to install as the required dependency of Nextflow. Passed to the underlying setup-java action."
    required: false
    default: "temurin"
  secrets:
    description: "Nextflow secrets to set, in KEY=VALUE format (one per line). See README for usage."
    required: false
    default: ""
  token:
    description: "GitHub token used to resolve Nextflow version aliases."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      if: ${{ inputs.install-java == 'true' }}
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
    # Java was not installed by this action, so make sure Nextflow will be able
    # to find one before we get as far as running it
    - name: Check for an existing Java installation
      if: ${{ inputs.install-java != 'true' }}
      shell: bash
      run: |
        if [[ -n "${JAVA_HOME:-}" && -x "${JAVA_HOME}/bin/java" ]]; then
          java_cmd="${JAVA_HOME}/bin/java"
        elif command -v java > /dev/null 2>&1; then
          java_cmd="java"
        else
          echo "::error title=Java not found::The 'install-java' input is not 'true', so this action did not install Java, but no 'java' executable was found via JAVA_HOME or on the PATH. Install a Java version supported by Nextflow before this step, or drop the 'install-java' input to let this action install one for you."
          exit 1
        fi
        echo "Using the Java already available on the runner: ${java_cmd}"
        "${java_cmd}" -version
    - name: Install Nextflow
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: node ${{ github.action_path }}/dist/index.js
branding:
  icon: "shuffle"
  color: "green"
